<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        user-scalable=no">

  <title>攤位改造 AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #startButton {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 9999;

      padding: 14px 26px;
      border: none;
      border-radius: 30px;

      font-size: 18px;
      font-weight: bold;

      background: white;
      color: black;

      box-shadow: 0 3px 12px rgba(0,0,0,.35);
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;

      padding: 10px 18px;
      border-radius: 20px;

      background: rgba(0,0,0,.65);
      color: white;

      font-size: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="message">
  請將手機對準 Before 照片
</div>

<button id="startButton">
  點一下啟動 AR
</button>


<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiScanning: yes;
    filterMinCF: 0.001;
    filterBeta: 0.01;
    warmupTolerance: 5;
    missTolerance: 10;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">


  <a-assets>

    <video
      id="arVideo"
      src="./before-after.mp4"

      preload="auto"

      muted

      playsinline

      webkit-playsinline>

    </video>

  </a-assets>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">


    <a-video
      id="videoPlane"

      src="#arVideo"

      position="0 0 0.01"

      width="0.90"

      height="0.50625">

    </a-video>


  </a-entity>

</a-scene>


<script>

const video =
  document.querySelector("#arVideo");

const target =
  document.querySelector("#target");

const button =
  document.querySelector("#startButton");

const message =
  document.querySelector("#message");


let playing = false;

let lostTimer = null;


/* -------------------------
   啟動
------------------------- */

button.addEventListener(
  "click",
  async () => {

    try {

      await video.play();

      video.pause();

      video.currentTime = 0;

    }

    catch (e) {

      console.log(e);

    }

    button.style.display = "none";

    message.innerHTML =
      "請將手機對準 Before 照片";

  }
);


/* -------------------------
   找到照片
------------------------- */

target.addEventListener(
  "targetFound",
  () => {

    /* 如果剛剛只是短暫失去辨識，
       不要停止影片 */

    if (lostTimer) {

      clearTimeout(lostTimer);

      lostTimer = null;

    }


    message.innerHTML =
      "✓ 已辨識｜正在播放改造成果";


    if (!playing) {

      video.currentTime = 0;

      video.play();

      playing = true;

    }

  }
);


/* -------------------------
   暫時失去照片
------------------------- */

target.addEventListener(
  "targetLost",
  () => {

    message.innerHTML =
      "請保持手機對準照片";


    /*
      不立即停止。

      等 1.5 秒。

      可以避免手稍微晃一下，
      影片立刻消失。
    */

    lostTimer =
      setTimeout(() => {

        video.pause();

        playing = false;

        message.innerHTML =
          "請重新對準 Before 照片";

      }, 1500);

  }
);


/* -------------------------
   影片播放完成
------------------------- */

video.addEventListener(
  "ended",
  () => {

    /*
      不重新播放。

      停留在最後一幀，
      讓觀眾看到 After。
    */

    playing = false;

    message.innerHTML =
      "✓ 攤位改造完成";

  }
);

</script>

</body>
</html>
